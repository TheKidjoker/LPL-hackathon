AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Second Look - API, tables, and Lambdas. Owner Thomas. Only Thomas runs sam deploy.

Parameters:
  ModelId:
    Type: String
    Default: us.anthropic.claude-opus-5
  FallbackModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-5
  AllowedOrigins:
    Type: String
    Default: https://main.d1s6iogq4h15rg.amplifyapp.com,http://localhost:5173
    Description: Comma-separated sites allowed to call the API from a browser

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512
    CodeUri: ../backend/
    Layers:
      - !Ref AiLayer
      - !Ref SeedDataLayer
    Environment:
      Variables:
        SEED_DATA_DIR: /opt
        MODEL_ID: !Ref ModelId
        FALLBACK_MODEL_ID: !Ref FallbackModelId
        ACCOUNTS_TABLE: !Ref AccountsTable
        TRANSACTIONS_TABLE: !Ref TransactionsTable
        CASES_TABLE: !Ref CasesTable
        AUDIT_TABLE: !Ref AuditTable
        GUARDRAIL_ID: !GetAtt CaseGuardrail.GuardrailId
        GUARDRAIL_VERSION: !GetAtt CaseGuardrailVersion.Version
        QUESTION_GUARDRAIL_ID: !GetAtt QuestionGuardrail.GuardrailId
        QUESTION_GUARDRAIL_VERSION: !GetAtt QuestionGuardrailVersion.Version
        # Roles come only from the verified Cognito group, never the X-Role header.
        ALLOW_ROLE_HEADER: "false"
        # Sites allowed to call the API from a browser. The handler echoes the caller's
        # Origin only when it is on this list.
        ALLOWED_ORIGINS: !Ref AllowedOrigins
  Api:
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,Authorization,X-Role'"
      AllowMethods: "'GET,POST,OPTIONS'"
    # Every route needs a valid Cognito ID token in the Authorization header.
    Auth:
      DefaultAuthorizer: CognitoAuth
      AddDefaultAuthorizerToCorsPreflight: false
      Authorizers:
        CognitoAuth:
          UserPoolArn: !GetAtt UserPool.Arn
          Identity:
            Header: Authorization
    # Let the browser read 401 and 403 responses from the authorizer.
    GatewayResponses:
      DEFAULT_4XX:
        ResponseParameters:
          Headers:
            Access-Control-Allow-Origin: "'*'"
            Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Role'"

Resources:
  # Cognito: who the caller is. The group (client, advisor, fraud) is the role.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: second-look-web
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  ClientGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: client, Description: Clients }

  AdvisorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: advisor, Description: Financial advisors }

  FraudGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: fraud, Description: Fraud team }

  # /ai packaged as a layer, so handlers can `from fraud_ai import score_withdrawal`
  AiLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../ai/
      CompatibleRuntimes:
        - python3.11
    Metadata:
      BuildMethod: python3.11

  # /data packaged as-is, so demo_reset can reload the seed data from /opt/accounts.json etc.
  SeedDataLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../data/
      CompatibleRuntimes:
        - python3.11

  # One customer-managed key encrypts every table and the CloudTrail logs
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Second Look - encrypts DynamoDB tables and CloudTrail logs
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: kms:*
            Resource: "*"
          - Sid: CloudTrailEncryptLogs
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub "arn:aws:cloudtrail:*:${AWS::AccountId}:trail/*"
          - Sid: CloudTrailDescribeKey
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: kms:DescribeKey
            Resource: "*"

  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-data"
      TargetKeyId: !Ref DataKey

  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref DataKey }
      AttributeDefinitions:
        - { AttributeName: accountId, AttributeType: S }
      KeySchema:
        - { AttributeName: accountId, KeyType: HASH }

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref DataKey }
      AttributeDefinitions:
        - { AttributeName: accountId, AttributeType: S }
        - { AttributeName: timestamp, AttributeType: S }
      KeySchema:
        - { AttributeName: accountId, KeyType: HASH }
        - { AttributeName: timestamp, KeyType: RANGE }

  CasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref DataKey }
      AttributeDefinitions:
        - { AttributeName: caseId, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: caseId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - { AttributeName: status, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref DataKey }
      AttributeDefinitions:
        - { AttributeName: caseId, AttributeType: S }
        - { AttributeName: timestamp, AttributeType: S }
      KeySchema:
        - { AttributeName: caseId, KeyType: HASH }
        - { AttributeName: timestamp, KeyType: RANGE }

  # One role for every Lambda: these four tables, Claude on Bedrock, and logs
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: speed-bump-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt AccountsTable.Arn
                  - !GetAtt TransactionsTable.Arn
                  - !GetAtt CasesTable.Arn
                  - !Sub "${CasesTable.Arn}/index/*"
                  - !GetAtt AuditTable.Arn
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-*"
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-*
              - Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource:
                  - !GetAtt CaseGuardrail.GuardrailArn
                  - !GetAtt QuestionGuardrail.GuardrailArn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Resource: !GetAtt DataKey.Arn

  # Bedrock Guardrails, two of them:
  # - QuestionGuardrail: staff questions to Juno that ask for investment advice are refused before
  #   any model call. Only questions are checked: a memo describing an investment scam is evidence.
  # - OutputGuardrail: everything the AI writes (memo, Juno, scam-check chat) has identity and
  #   account numbers masked.
  QuestionGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "${AWS::StackName}-juno-questions"
      Description: Second Look - refuses requests for investment advice in questions to Juno
      BlockedInputMessaging: Juno can't give investment advice. Ask about this case's facts, risk signals, or next steps instead.
      BlockedOutputsMessaging: Juno can't give investment advice. Ask about this case's facts, risk signals, or next steps instead.
      TopicPolicyConfig:
        TopicsConfig:
          - Name: InvestmentAdvice
            Type: DENY
            Definition: "Requests for advice on what to invest in: which securities, funds, crypto, or other assets to buy, sell, or hold, or how to invest or allocate money."
            Examples:
              - Should she move this money into an index fund?
              - What should Harold invest in instead?
              - Is Bitcoin a good buy right now?
              - How should I allocate my retirement savings?

  QuestionGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt QuestionGuardrail.GuardrailId
      Description: Version 1

  CaseGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "${AWS::StackName}-juno-guardrail"
      Description: Second Look - masks identity and account numbers in everything the AI writes
      BlockedInputMessaging: This request can't be processed.
      BlockedOutputsMessaging: This response was withheld because it contained sensitive information.
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - { Type: US_SOCIAL_SECURITY_NUMBER, Action: ANONYMIZE }
          - { Type: CREDIT_DEBIT_CARD_NUMBER, Action: ANONYMIZE }
          - { Type: US_BANK_ACCOUNT_NUMBER, Action: ANONYMIZE }
          - { Type: US_BANK_ROUTING_NUMBER, Action: ANONYMIZE }
          - { Type: PIN, Action: ANONYMIZE }
          - { Type: PASSWORD, Action: ANONYMIZE }

  CaseGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt CaseGuardrail.GuardrailId
      Description: Version 2, masking only

  # CloudTrail: who did what, including every read and write on the tables
  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DataKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail"
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail"

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Sub "${AWS::StackName}-trail"
      S3BucketName: !Ref TrailBucket
      KMSKeyId: !GetAtt DataKey.Arn
      IsLogging: true
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: false
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
          DataResources:
            - Type: AWS::DynamoDB::Table
              Values:
                - !GetAtt AccountsTable.Arn
                - !GetAtt TransactionsTable.Arn
                - !GetAtt CasesTable.Arn
                - !GetAtt AuditTable.Arn

  SubmitWithdrawalFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.submit_withdrawal.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties: { Path: /withdrawals, Method: post }

  ListCasesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.list_cases.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties: { Path: /cases, Method: get }

  GetCaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.get_case.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties: { Path: "/cases/{caseId}", Method: get }

  CaseContextFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.case_context.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties: { Path: "/cases/{caseId}/context", Method: get }

  AssistantFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.assistant.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      Events:
        Api:
          Type: Api
          Properties: { Path: "/cases/{caseId}/assistant", Method: post }

  PostResponseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.post_response.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties: { Path: "/cases/{caseId}/responses", Method: post }

  PostDecisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.post_decision.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties: { Path: "/cases/{caseId}/decision", Method: post }

  # EventBridge Scheduler runs this every 15 minutes: holds past their end date with no
  # decision are escalated, never released.
  HoldExpiryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.hold_expiry.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 60
      Events:
        Every15Minutes:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)
            Description: Escalate held withdrawals whose hold has ended with no decision

  DemoResetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.demo_reset.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        Api:
          Type: Api
          Properties: { Path: /demo/reset, Method: post }

Outputs:
  ApiUrl:
    Description: Base URL for the frontend (VITE_API_URL)
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  UserPoolId:
    Description: Cognito user pool (scripts/create_demo_users.py)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client for the frontend (VITE_COGNITO_CLIENT_ID)
    Value: !Ref UserPoolClient
  AccountsTableName:
    Value: !Ref AccountsTable
  TransactionsTableName:
    Value: !Ref TransactionsTable
  CasesTableName:
    Value: !Ref CasesTable
  AuditTableName:
    Value: !Ref AuditTable
  DataKeyArn:
    Value: !GetAtt DataKey.Arn
  TrailBucketName:
    Value: !Ref TrailBucket
